repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0  # Use the latest stable version
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.4.2  # Use the latest stable version
    hooks:
      - id: black

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.15.0
    hooks:
      - id: gitleaks
